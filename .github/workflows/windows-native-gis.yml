name: Windows Native GIS Build

on:
  push:
    paths:
      - 'MapDataManager/**'
      - 'MapDataManager.sln'
      - '.github/workflows/windows-native-gis.yml'
  pull_request:
    paths:
      - 'MapDataManager/**'
      - 'MapDataManager.sln'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore MapDataManager.sln
      - name: Build
        run: dotnet build MapDataManager.sln --configuration Release --no-restore
