name: Windows Native GIS Build

on:
  push:
    paths:
      - 'MapDataManager/**'
      - 'MapDataManager.sln'
      - '.github/workflows/windows-native-gis.yml'
  pull_request:
    paths:
      - 'MapDataManager/**'
      - 'MapDataManager.sln'
      - '.github/workflows/windows-native-gis.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore MapDataManager.sln

      - name: Build Release
        run: dotnet build MapDataManager.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish MapDataManager/MapDataManager.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output publish/win-x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MapDataManager-win-x64
          path: publish/win-x64/
